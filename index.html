<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sport Dashboard</title>
  <style>
    :root {
      --bg:#0f1117; --s1:#1a1d27; --border:#2e3348;
      --blue:#4f8ef7; --green:#34c77b; --yellow:#f7c948; --purple:#a78bfa;
      --text:#e4e6f0; --muted:#7a7f9a;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .wrap { max-width:480px; width:100%; }
    .header { text-align:center; margin-bottom:40px; }
    .header h1 { font-size:24px; font-weight:700; margin-bottom:6px; }
    .header p { color:var(--muted); font-size:14px; }
    .cards { display:flex; flex-direction:column; gap:14px; }
    a.card {
      display:flex; align-items:center; gap:16px;
      background:var(--s1); border:1px solid var(--border); border-radius:12px;
      padding:18px 20px; text-decoration:none; color:var(--text);
      transition:border-color .2s, background .2s;
    }
    a.card:hover { background:#22263a; }
    .card-icon { font-size:28px; flex-shrink:0; }
    .card-text h2 { font-size:16px; font-weight:600; margin-bottom:3px; }
    .card-text p { font-size:13px; color:var(--muted); }
    .card-arrow { margin-left:auto; color:var(--muted); font-size:18px; }
    .card.blue  { border-left:3px solid var(--blue); }
    .card.green { border-left:3px solid var(--green); }
    .card.yellow{ border-left:3px solid var(--yellow); }
    .card.purple{ border-left:3px solid var(--purple); }
    footer { text-align:center; margin-top:40px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Sport Dashboard</h1>
    <p>Dein persönliches Trainings-Cockpit</p>
  </div>
  <div class="cards">
    <a class="card green" href="comeback.html">
      <div class="card-icon">💪</div>
      <div class="card-text">
        <h2>Comeback Tracker</h2>
        <p>Recovery-Stand · Progression · Projektion</p>
      </div>
      <div class="card-arrow">›</div>
    </a>
    <a class="card yellow" href="plan/analyse_aug2025_apr2026.html">
      <div class="card-icon">📊</div>
      <div class="card-text">
        <h2>Trainingsanalyse</h2>
        <p>Aug 2025 – Apr 2026 · Gym &amp; Laufen</p>
      </div>
      <div class="card-arrow">›</div>
    </a>
    <a class="card blue" href="README.html">
      <div class="card-icon">📖</div>
      <div class="card-text">
        <h2>System-Dokumentation</h2>
        <p>Was Claude kann · Dateistruktur · Anleitungen</p>
      </div>
      <div class="card-arrow">›</div>
    </a>
  </div>
  <footer>Letzte Aktualisierung: April 2026</footer>
</div>
</body>
</html>
